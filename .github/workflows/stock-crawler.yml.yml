name: Stock Crawler
on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: '測試模式（跳過時間閘門）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_date:
        description: '強制日期（如 2026-05-29），空白=用今天'
        required: false
        default: ''
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: 寫入 Firebase 憑證檔
        run: |
          echo '${{ secrets.FIREBASE_CREDENTIAL }}' > /tmp/firebase-key.json
      - name: 執行雲端爬蟲
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          FORCE_DATE: ${{ github.event.inputs.force_date || '' }}
        run: |
          echo "Project ID 長度：$(echo -n $FIREBASE_PROJECT_ID | wc -c)"
          echo "JSON 裡的 Project ID："
          grep project_id /tmp/firebase-key.json
          echo "憑證檔大小：$(wc -c < /tmp/firebase-key.json) bytes"
          cd StockRankTracker.Cloud
          dotnet run
