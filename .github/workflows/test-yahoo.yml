name: Test Yahoo Crawl

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Yahoo Stock Rank Page
        run: |
          echo "=== 測試抓取 Yahoo 股市成交金額排行 ==="

          HTTP_CODE=$(curl -s -o /tmp/yahoo.html -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://tw.stock.yahoo.com/rank/turnover")

          echo "HTTP 狀態碼：$HTTP_CODE"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ 成功！"
            FILE_SIZE=$(wc -c < /tmp/yahoo.html)
            echo "頁面大小：$FILE_SIZE bytes"
            echo "=== 頁面前 2000 字元 ==="
            head -c 2000 /tmp/yahoo.html
          else
            echo "❌ 失敗！"
            head -c 500 /tmp/yahoo.html
          fi
